[package]
name = "lipflow"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "lipflow"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
lipflow-vsr = { path = "../vsr" }
lipflow-face = { path = "../face" }
lipflow-llm = { path = "../llm" }
candle-core = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3.4", features = ["json"] }
flate2 = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
lipflow-vsr = { path = "../vsr", features = ["metal", "accelerate"] }
lipflow-llm = { path = "../llm", features = ["metal", "accelerate"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-avf-audio = { version = "0.3.2", features = ["block2"] }
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "block2", "dispatch2"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
block2 = "0.6.2"
dispatch2 = "0.3.0"
