[package]
name = "lipflow-vsr"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
candle-metal-kernels = { version = "0.11.0", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[features]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
